<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pemutar Media dengan Playlist</title>
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js"></script>
</head>
<body>

<div class="player-card">
    <h2>Media Player</h2>
    
    <input type="file" id="fileInput" accept="video/*, audio/*" multiple class="upload-btn">

    <video id="mainPlayer" controls></video>

    <div class="playlist-container">
        <h3>Playlist</h3>
        <ul id="playlist">
            </ul>
    </div>
</div>
</body>
</html>
